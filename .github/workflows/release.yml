name: Release
# Push a tag like v3.0.1 to build binaries and publish them on the GitHub Release page.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: x86_64-apple-darwin } # cross-compiled on the arm64 runner
          - { os: macos-latest,     target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=ssh-fm-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/ssh-fm "$name/"
          cp LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ssh-fm-${{ matrix.target }}.tar.gz
            ssh-fm-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
