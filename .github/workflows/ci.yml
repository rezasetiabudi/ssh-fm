name: CI
on:
  push:
    branches: [main, master]
    paths: ["src/**", "Cargo.*", "install.sh", ".github/workflows/**"]
  pull_request:
    paths: ["src/**", "Cargo.*", "install.sh", ".github/workflows/**"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
